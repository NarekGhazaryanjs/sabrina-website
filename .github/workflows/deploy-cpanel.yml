name: Deploy to reg.am cPanel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'NarekGhazaryanjs/sabrina-website'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build cPanel release (Linux)
        env:
          SABRINA_AUTH_SECRET: ${{ secrets.SABRINA_AUTH_SECRET }}
          SABRINA_ADMIN_PASSWORD: ${{ secrets.SABRINA_ADMIN_PASSWORD }}
        run: npm run build:cpanel

      - name: Upload release via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: release-cpanel/
          server-dir: /iisshha-site/
          dangerous-clean-slate: true

      - name: Deploy note
        run: |
          echo "Files uploaded. In cPanel → Setup Node.js App:"
          echo "  1. Run NPM Install (only if package.json changed)"
          echo "  2. Restart application"
          echo "Health: https://iisshha.com/api/health"

      - name: Health check
        continue-on-error: true
        run: |
          sleep 20
          curl -fsSL "https://iisshha.com/api/health" || true
