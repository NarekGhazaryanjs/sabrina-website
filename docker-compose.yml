services:
  web:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SITE_URL=${SITE_URL:-http://localhost:4000}
    volumes:
      - sabrina-data:/app/data
      - sabrina-uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sabrina-data:
  sabrina-uploads:
